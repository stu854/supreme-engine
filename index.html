<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏓 Neon Ping Pong</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle,#312e81,#020617);
    font-family:Arial, sans-serif;
    color:white;
}

.game-container{
    text-align:center;
}

h1{
    margin-bottom:15px;
    color:#67e8f9;
    text-shadow:0 0 20px #22d3ee;
}

.score{
    font-size:32px;
    margin-bottom:10px;
}

canvas{
    background:
    linear-gradient(
    90deg,
    #020617,
    #111827
    );
    border:4px solid #22d3ee;
    border-radius:15px;
    box-shadow:
    0 0 30px #22d3ee;
    max-width:95vw;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    border-radius:20px;
    background:#22d3ee;
    color:#00111a;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

.controls{
    margin-top:15px;
    color:#cbd5e1;
}

.mobile{
    margin-top:10px;
}

.mobile button{
    width:80px;
    margin:5px;
}

</style>

</head>

<body>

<div class="game-container">

<h1>🏓 Neon Ping Pong</h1>

<div class="score">
<span id="playerScore">0</span>
 :
<span id="computerScore">0</span>
</div>

<canvas id="game" width="800" height="450"></canvas>

<br>

<button onclick="restart()">🔄 Restart</button>

<div class="controls">
⬆️ Move Up: W / Arrow Up
<br>
⬇️ Move Down: S / Arrow Down
</div>

<div class="mobile">

<button ontouchstart="moveUp=true" ontouchend="moveUp=false">
⬆️
</button>

<button ontouchstart="moveDown=true" ontouchend="moveDown=false">
⬇️
</button>

</div>

</div>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let playerScore=0;
let computerScore=0;


let moveUp=false;
let moveDown=false;


const paddle={
width:15,
height:100,
speed:7
};


let player={
x:20,
y:175,
...paddle
};


let computer={
x:765,
y:175,
...paddle
};


let ball={
x:400,
y:225,
radius:10,
speed:6,
dx:6,
dy:4
};



function sound(freq){

let audio=
new AudioContext();

let osc=
audio.createOscillator();

osc.frequency.value=freq;

osc.connect(audio.destination);

osc.start();

osc.stop(
audio.currentTime+0.08
);

}



function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


// middle line

ctx.strokeStyle="#334155";
ctx.setLineDash([10,10]);

ctx.beginPath();

ctx.moveTo(
canvas.width/2,
0
);

ctx.lineTo(
canvas.width/2,
canvas.height
);

ctx.stroke();

ctx.setLineDash([]);


// paddles

ctx.fillStyle="#22d3ee";

ctx.fillRect(
player.x,
player.y,
player.width,
player.height
);


ctx.fillStyle="#f472b6";

ctx.fillRect(
computer.x,
computer.y,
computer.width,
computer.height
);


// ball

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.radius,
0,
Math.PI*2
);

ctx.fillStyle="#facc15";

ctx.fill();

}


function update(){

if(moveUp)
player.y-=player.speed;

if(moveDown)
player.y+=player.speed;


if(player.y<0)
player.y=0;

if(player.y+player.height>canvas.height)
player.y=canvas.height-player.height;


// computer AI

let center=
computer.y+
computer.height/2;


if(center<ball.y)
computer.y+=4;

else
computer.y-=4;



ball.x+=ball.dx;
ball.y+=ball.dy;



// wall collision

if(
ball.y-ball.radius<0 ||
ball.y+ball.radius>canvas.height
){

ball.dy*=-1;

sound(200);

}



// paddle collision

if(
ball.x-ball.radius<player.x+player.width &&
ball.y>player.y &&
ball.y<player.y+player.height
){

ball.dx*=-1;

ball.speed+=0.2;

sound(500);

}



if(
ball.x+ball.radius>computer.x &&
ball.y>computer.y &&
ball.y<computer.y+computer.height
){

ball.dx*=-1;

ball.speed+=0.2;

sound(500);

}



// scoring


if(ball.x<0){

computerScore++;

updateScore();

resetBall();

}


if(ball.x>canvas.width){

playerScore++;

updateScore();

resetBall();

}


}


function resetBall(){

ball.x=
canvas.width/2;

ball.y=
canvas.height/2;

ball.speed=6;

ball.dx=
Math.random()>0.5?6:-6;

ball.dy=
Math.random()*6-3;

}



function updateScore(){

document.getElementById(
"playerScore"
).textContent=playerScore;


document.getElementById(
"computerScore"
).textContent=computerScore;

}



function restart(){

playerScore=0;
computerScore=0;

updateScore();

player.y=175;
computer.y=175;

resetBall();

}



function loop(){

update();

draw();

requestAnimationFrame(loop);

}



document.addEventListener(
"keydown",
e=>{

if(e.key==="ArrowUp"||e.key==="w")
moveUp=true;


if(e.key==="ArrowDown"||e.key==="s")
moveDown=true;

});


document.addEventListener(
"keyup",
e=>{

if(e.key==="ArrowUp"||e.key==="w")
moveUp=false;


if(e.key==="ArrowDown"||e.key==="s")
moveDown=false;

});


loop();

</script>

</body>
</html>
