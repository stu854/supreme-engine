<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Happy Spark Birthday Card Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Segoe UI,sans-serif;
}

body{
background:linear-gradient(135deg,#fff7ef,#ffe5f5,#fff9dc);
min-height:100vh;
padding:30px;
color:#333;
}

h1{
text-align:center;
font-size:2.4rem;
margin-bottom:10px;
color:#ff5d8f;
}

.subtitle{
text-align:center;
margin-bottom:25px;
color:#777;
}

.container{
display:grid;
grid-template-columns:380px 1fr;
gap:25px;
max-width:1300px;
margin:auto;
}

.panel{
background:white;
padding:22px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

label{
display:block;
margin-top:14px;
margin-bottom:6px;
font-weight:600;
}

input,textarea,select{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:12px;
outline:none;
transition:.3s;
}

input:focus,
textarea:focus,
select:focus{
border-color:#ff72aa;
box-shadow:0 0 0 4px rgba(255,114,170,.15);
}

textarea{
resize:vertical;
min-height:90px;
}

.buttons{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

button{
border:none;
padding:12px 16px;
border-radius:12px;
cursor:pointer;
background:#ff5d8f;
color:white;
font-weight:bold;
transition:.25s;
}

button:hover{
transform:translateY(-2px);
}

.secondary{
background:#5f6fff;
}

.green{
background:#1fb56a;
}

.orange{
background:#ff9a29;
}

.previewArea{
display:flex;
flex-direction:column;
gap:25px;
}

.card{
background:white;
border-radius:22px;
padding:35px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
position:relative;
overflow:hidden;
transition:.3s;
}

.card:before{
content:"";
position:absolute;
left:0;
top:0;
width:100%;
height:12px;
background:linear-gradient(90deg,#ff5d8f,#ffc54d,#6ec6ff);
}

.inside{
border:2px dashed rgba(0,0,0,.1);
border-radius:18px;
padding:25px;
min-height:340px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background:rgba(255,255,255,.65);
}

.card h2{
font-size:2rem;
margin-bottom:15px;
}

.card p{
margin:8px 0;
line-height:1.6;
}

.small{
margin-top:20px;
font-style:italic;
opacity:.75;
}

.stackTitle{
font-size:1.3rem;
font-weight:bold;
margin-bottom:5px;
color:#ff5d8f;
}

.theme-gold{
background:linear-gradient(135deg,#fffef5,#fff4cf);
}

.theme-neon{
background:linear-gradient(135deg,#221244,#432067);
color:white;
}

.theme-balloons{
background:linear-gradient(135deg,#e9f8ff,#fff2f9);
}

.confetti{
position:fixed;
width:8px;
height:14px;
pointer-events:none;
animation:fall 2.4s linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}
</style>
</head>
<body>

<h1>🎂 Happy Spark Birthday Card Studio 🎈</h1>
<div class="subtitle">
Create beautiful birthday cards, generate ideas instantly, and keep every card you've made.
</div>

<div class="container">

<div class="panel">

<label>Recipient Name</label>
<input id="name" placeholder="Sophia">

<label>Age</label>
<input id="age" placeholder="25">

<label>Relationship</label>
<input id="relationship" placeholder="Friend / Sister / Dad">

<label>Hobbies</label>
<input id="hobbies" placeholder="Gaming, Reading, Music">

<label>Custom Message</label>
<textarea id="message" placeholder="Write your own message..."></textarea>

<label>Theme</label>

<select id="theme">
<option value="theme-gold">✨ Elegant Gold</option>
<option value="theme-neon">🌈 Retro Neon</option>
<option value="theme-balloons">🎈 Cute Balloons</option>
</select>

<div class="buttons">

<button onclick="generateCard()">🎉 Generate Card</button>

<button class="secondary" onclick="lucky()">🍀 I'm Feeling Lucky</button>

<button class="orange" onclick="randomJoke()">😂 Birthday Joke</button>

<button class="green" onclick="downloadCard()">⬇ Download Image</button>

<button onclick="toggleMusic()">🎵 Music</button>

</div>

</div>

<div class="previewArea">

<div class="stackTitle">
Live Preview
</div>

<div id="liveCard" class="card theme-gold">
<div class="inside">

<h2 id="liveTitle">Happy Birthday!</h2>

<p id="liveMessage">
Your birthday message appears here.
</p>

<p class="small">
Made with ❤️
</p>

</div>
</div>

<div class="stackTitle">
Birthday Card Collection
</div>

<div id="history"></div>

</div>

</div>

<audio id="music" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_34dce0d5ef.mp3?filename=happy-day-112194.mp3">
</audio>

<script>

const jokes=[
"You're not getting older... you're becoming a classic edition.",
"Calories don't count on birthdays. Science-ish.",
"Age is just a number... a really impressive one!",
"Another birthday? You've clearly mastered surviving one more year.",
"Congratulations! You've officially leveled up."
];

const luckyMessages=[
"May your adventures be bigger than your cake and your laughter louder than the candles.",
"Wishing you endless joy, unforgettable memories, and a year packed with wonderful surprises.",
"Hope today is filled with smiles, amazing food, and people who make life brighter.",
"Another trip around the sun deserves extra cake and even more happiness.",
"Celebrate big today—you've earned every smile."
];

const previews=["name","message","theme"];

previews.forEach(id=>{
document.getElementById(id).addEventListener("input",updatePreview);
});

updatePreview();

function updatePreview(){

let name=document.getElementById("name").value||"Amazing Human";

let msg=document.getElementById("message").value||"Your birthday message appears here.";

let theme=document.getElementById("theme").value;

let card=document.getElementById("liveCard");

card.className="card "+theme;

document.getElementById("liveTitle").innerHTML="🎂 Happy Birthday, "+name+"!";

document.getElementById("liveMessage").innerHTML=msg;

}

function randomJoke(){

document.getElementById("message").value=
jokes[Math.floor(Math.random()*jokes.length)];

updatePreview();

}

function lucky(){

document.getElementById("name").value||="Friend";

document.getElementById("age").value||=Math.floor(Math.random()*40+18);

document.getElementById("relationship").value||="Best Friend";

document.getElementById("hobbies").value||="Travel, Coffee, Music";

let name=document.getElementById("name").value;
let age=document.getElementById("age").value;
let relation=document.getElementById("relationship").value;
let hobbies=document.getElementById("hobbies").value;

let msg=
`Happy Birthday ${name}! 🎉

${luckyMessages[Math.floor(Math.random()*luckyMessages.length)]}

Turning ${age} is a fantastic milestone. Being such an amazing ${relation.toLowerCase()} makes every celebration brighter.

May you enjoy lots of ${hobbies.toLowerCase()}, delicious cake, unforgettable moments, and endless happiness! ❤️`;

document.getElementById("message").value=msg;

updatePreview();

}

function generateCard(){

updatePreview();

burst();

let clone=document.getElementById("liveCard").cloneNode(true);

document.getElementById("history").prepend(clone);

}

function burst(){

for(let i=0;i<180;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.top="-20px";

c.style.background=
`hsl(${Math.random()*360},90%,60%)`;

c.style.transform=`rotate(${Math.random()*360}deg)`;

c.style.animationDuration=(2+Math.random()*2)+"s";

document.body.appendChild(c);

setTimeout(()=>c.remove(),4000);

}

}

function downloadCard(){

html2canvas(document.getElementById("liveCard")).then(canvas=>{

let a=document.createElement("a");

a.download="birthday-card.png";

a.href=canvas.toDataURL();

a.click();

});

}

function toggleMusic(){

const m=document.getElementById("music");

if(m.paused){

m.play();

}else{

m.pause();

}

}

</script>

</body>
</html>
